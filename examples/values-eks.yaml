namespace:
  create: true
  name: simpleswe

image:
  repository: ghcr.io/simpleswe/simpleswe
  tag: "0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

hermes:
  enabled: true
  image:
    repository: ghcr.io/simpleswe/simpleswe-hermes
    # Publish this release tag immutably; do not use latest.
    tag: "v0.20.0-simpleswe.1"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  config:
    model: openai/gpt-5.6-luna
  storage:
    storageClass: gp3
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  secrets:
    slack:
      name: simpleswe-hermes-slack
      keys:
        botToken: bot-token
        appToken: app-token
        allowedUser: allowed-user
    modelProvider:
      name: simpleswe-hermes-model
      key: api-key
      env: OPENAI_API_KEY

storage:
  storageClass: gp3
  size: 20Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64

config:
  controller:
    listen_address: ":8080"
    webhook_listen_address: ":8081"
    namespace: simpleswe
    deadline: 30m
    max_fix_attempts: 3
  worker:
    image: ghcr.io/simpleswe/simpleswe-worker:0.1.0
    command: opencode
    branch_prefix: simpleswe/
    deadline: 30m
  bitbucket:
    base_url: https://api.bitbucket.org
  repositories:
    widget:
      clone_url: https://bitbucket.org/acme/widget.git
      default_branch: main
      worker:
        image: ghcr.io/simpleswe/simpleswe-worker:0.1.0
        node_selector:
          kubernetes.io/os: linux
          kubernetes.io/arch: amd64
      git:
        ssh_secret: widget-git-ssh
      bitbucket:
        workspace: acme
        repository: widget
        credentials_secret_name: bitbucket-widget
    gadget:
      clone_url: https://bitbucket.org/acme/gadget.git
      default_branch: main
      worker:
        image: ghcr.io/simpleswe/simpleswe-worker:0.1.0
        node_selector:
          kubernetes.io/os: linux
          kubernetes.io/arch: amd64
      git:
        ssh_secret: gadget-git-ssh
      bitbucket:
        workspace: acme
        repository: gadget
        credentials_secret_name: bitbucket-gadget
