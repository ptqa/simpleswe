namespace:
  create: false
  name: simpleswe

image:
  repository: simpleswe-controller
  tag: kind
  pullPolicy: Never

hermes:
  enabled: false

storage:
  size: 1Gi

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

config:
  controller:
    listen_address: ":8080"
    webhook_listen_address: ":8081"
    namespace: simpleswe
    deadline: 10m
    max_fix_attempts: 1
  worker:
    image: simpleswe-worker:kind
    command: opencode
    branch_prefix: simpleswe/
    deadline: 10m
  bitbucket:
    base_url: https://api.bitbucket.org
  repositories:
    simpleswe:
      default_branch: master
      worker:
        image: simpleswe-worker:kind
        env:
          - name: OPENAI_API_KEY
            secret:
              name: opencode-provider
              key: OPENAI_API_KEY
          - name: GH_TOKEN
            secret:
              name: github-simpleswe
              key: token
      opencode:
        command: [opencode, run, --model, openai/gpt-5.6-luna]
      validation:
        commands:
          - [git, diff, --check]
      github:
        owner: ptqa
        repository: simpleswe
        credentials_secret_name: github-simpleswe
