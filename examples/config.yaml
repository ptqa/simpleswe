controller:
  listen_address: ":8080"
  webhook_listen_address: ":8081"
  namespace: simpleswe
  deadline: 30m
  review_debounce: 30m
  max_fix_attempts: 3
worker:
  image: ghcr.io/simpleswe/simpleswe-worker:0.1.0
  command: opencode
  branch_prefix: simpleswe/
  deadline: 30m
bitbucket:
  base_url: https://api.bitbucket.org
  webhook_secret:
    file: /run/secrets/webhooks/bitbucket
repositories:
  widget:
    clone_url: https://bitbucket.org/acme/widget.git
    default_branch: main
    worker:
      image: ghcr.io/simpleswe/simpleswe-worker:0.1.0
      # The image must include a configured Bitbucket MCP so OpenCode can
      # push, create/update the PR, and report its number to simpleswe.
    git:
      ssh_secret: widget-git-ssh
    bitbucket:
      workspace: acme
      repository: widget
      credentials_secret_name: bitbucket-widget
