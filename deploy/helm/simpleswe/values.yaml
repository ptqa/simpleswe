namespace:
  create: false
  name: ""

image:
  repository: ghcr.io/simpleswe/simpleswe
  # Empty uses the pinned Chart appVersion. A digest takes precedence.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  name: ""

storage:
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

hermes:
  enabled: false
  image:
    repository: ghcr.io/simpleswe/simpleswe-hermes
    # Hermes must use an immutable release tag or digest when enabled.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  config:
    model: ""
  storage:
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce
  secrets:
    slack:
      name: ""
      keys:
        botToken: ""
        appToken: ""
        allowedUser: ""
    modelProvider:
      name: ""
      key: ""
      env: ""

nodeSelector: {}
tolerations: []
affinity: {}

secrets:
  webhooks:
    name: simpleswe-webhooks
    keys:
      github: github
      bitbucket: bitbucket

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  # The controller API has no authentication. Empty denies API pod ingress;
  # kubectl port-forward remains available because it is node-originated.
  # Entries are native NetworkPolicyPeer objects and may combine namespace and
  # pod selectors to trust only specific callers.
  trustedIngress: []
  # Peers allowed to reach only the signed webhook listener on port 8081.
  # Keep empty unless an in-cluster webhook gateway or forwarder needs access.
  webhookIngress: []
  # Standard NetworkPolicy cannot select DNS names. These CIDRs permit only
  # HTTPS and must cover the Kubernetes API, Slack, Bitbucket, GitHub, and public
  # repository/AI endpoints. The broad practical default can be replaced with
  # maintained provider CIDRs where stable ranges are available.
  httpsCIDRs:
    - 0.0.0.0/0
  # Extra native NetworkPolicy egress rules for worker repository access, such
  # as private Git CIDRs or TCP/22 for SSH. Public HTTPS is covered above.
  repositoryEgress: []

# This object is emitted as strict internal/config.Config YAML. Secret data is
# supplied only by the pre-existing Secrets named above or in repositories.
config:
  controller:
    listen_address: ":8080"
    webhook_listen_address: ":8081"
    namespace: ""
    deadline: 30m
    max_fix_attempts: 3
  worker:
    image: ghcr.io/simpleswe/simpleswe-worker:0.1.0
    command: opencode
    branch_prefix: simpleswe/
    deadline: 30m
  bitbucket:
    base_url: https://api.bitbucket.org
    webhook_secret:
      file: /run/secrets/webhooks/bitbucket
  github:
    base_url: https://api.github.com
    webhook_secret:
      file: /run/secrets/webhooks/github
  repositories: {}
