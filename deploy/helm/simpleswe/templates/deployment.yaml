{{- $bitbucketSecrets := dict -}}
{{- $githubSecrets := dict -}}
{{- $webhookProviders := dict "github" false "bitbucket" false -}}
{{- range $_, $repository := .Values.config.repositories -}}
{{- with $repository.github -}}
{{- $_ := set $githubSecrets .credentials_secret_name true -}}
{{- $_ := set $webhookProviders "github" true -}}
{{- end -}}
{{- with $repository.bitbucket -}}
{{- $_ := set $bitbucketSecrets .credentials_secret_name true -}}
{{- $_ := set $webhookProviders "bitbucket" true -}}
{{- end -}}
{{- end -}}
{{- $bitbucketSecretNames := keys $bitbucketSecrets | sortAlpha -}}
{{- $githubSecretNames := keys $githubSecrets | sortAlpha -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simpleswe.fullname" . }}
  namespace: {{ include "simpleswe.namespace" . }}
  labels:
    {{- include "simpleswe.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "simpleswe.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simpleswe.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | quote }}
    spec:
      serviceAccountName: {{ include "simpleswe.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "simpleswe.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --config
            - /etc/simpleswe/config.yaml
            - --database
            - /var/lib/simpleswe/tasks.db
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: webhooks
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/simpleswe
            - name: config
              mountPath: /etc/simpleswe
              readOnly: true
          {{- range $index, $secretName := $bitbucketSecretNames }}
            - name: bitbucket-credentials-{{ $index }}
              mountPath: {{ printf "/run/secrets/bitbucket/%s" $secretName | quote }}
              readOnly: true
          {{- end }}
          {{- range $index, $secretName := $githubSecretNames }}
            - name: github-credentials-{{ $index }}
              mountPath: {{ printf "/run/secrets/github/%s" $secretName | quote }}
              readOnly: true
          {{- end }}
          {{- if or (index $webhookProviders "github") (index $webhookProviders "bitbucket") }}
            - name: webhook-credentials
              mountPath: /run/secrets/webhooks
              readOnly: true
          {{- end }}
        {{- if .Values.hermes.enabled }}
        - name: hermes
          image: {{ include "simpleswe.hermesImage" . | quote }}
          imagePullPolicy: {{ .Values.hermes.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              : "${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN is empty}"
              : "${SLACK_APP_TOKEN:?SLACK_APP_TOKEN is empty}"
              : "${SLACK_ALLOWED_USERS:?SLACK_ALLOWED_USERS is empty}"
              eval ': "${'"$HERMES_MODEL_PROVIDER_ENV"':?model-provider credential is empty}"'
              exec hermes gateway
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_DISABLE_LAZY_INSTALLS
              value: "1"
            - name: HERMES_MODEL_PROVIDER_ENV
              value: {{ .Values.hermes.secrets.modelProvider.env | quote }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.secrets.slack.name | quote }}
                  key: {{ .Values.hermes.secrets.slack.keys.botToken | quote }}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.secrets.slack.name | quote }}
                  key: {{ .Values.hermes.secrets.slack.keys.appToken | quote }}
            - name: SLACK_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.secrets.slack.name | quote }}
                  key: {{ .Values.hermes.secrets.slack.keys.allowedUser | quote }}
            - name: {{ .Values.hermes.secrets.modelProvider.env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hermes.secrets.modelProvider.name | quote }}
                  key: {{ .Values.hermes.secrets.modelProvider.key | quote }}
          resources:
            {{- toYaml .Values.hermes.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
            - name: config
              mountPath: /opt/data/config.yaml
              subPath: hermes-config.yaml
              readOnly: true
            - name: config
              mountPath: /opt/data/skills/simpleswe/SKILL.md
              subPath: hermes-skill.md
              readOnly: true
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "simpleswe.fullname" . }}-data
        - name: config
          configMap:
            name: {{ include "simpleswe.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
          {{- if .Values.hermes.enabled }}
              - key: hermes-config.yaml
                path: hermes-config.yaml
              - key: hermes-skill.md
                path: hermes-skill.md
          {{- end }}
      {{- if .Values.hermes.enabled }}
        - name: hermes-data
          persistentVolumeClaim:
            claimName: {{ include "simpleswe.fullname" . }}-hermes-data
      {{- end }}
      {{- range $index, $secretName := $bitbucketSecretNames }}
        - name: bitbucket-credentials-{{ $index }}
          secret:
            secretName: {{ $secretName | quote }}
            items:
              - key: username
                path: username
              - key: app-password
                path: app-password
      {{- end }}
      {{- range $index, $secretName := $githubSecretNames }}
        - name: github-credentials-{{ $index }}
          secret:
            secretName: {{ $secretName | quote }}
            items:
              - key: token
                path: token
      {{- end }}
      {{- if or (index $webhookProviders "github") (index $webhookProviders "bitbucket") }}
        - name: webhook-credentials
          secret:
            secretName: {{ .Values.secrets.webhooks.name | quote }}
            items:
      {{- if index $webhookProviders "github" }}
              - key: {{ .Values.secrets.webhooks.keys.github | quote }}
                path: github
      {{- end }}
      {{- if index $webhookProviders "bitbucket" }}
              - key: {{ .Values.secrets.webhooks.keys.bitbucket | quote }}
                path: bitbucket
      {{- end }}
      {{- end }}
