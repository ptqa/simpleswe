apiVersion: v1
kind: Service
metadata:
  name: {{ include "simpleswe.fullname" . }}
  namespace: {{ include "simpleswe.namespace" . }}
  labels:
    {{- include "simpleswe.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "simpleswe.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- if .Values.config.repositories }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "simpleswe.fullname" . }}-webhooks
  namespace: {{ include "simpleswe.namespace" . }}
  labels:
    {{- include "simpleswe.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "simpleswe.selectorLabels" . | nindent 4 }}
  ports:
    - name: webhooks
      port: 8081
      targetPort: webhooks
      protocol: TCP
{{- end }}
