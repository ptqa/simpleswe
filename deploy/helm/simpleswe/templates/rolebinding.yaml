apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "simpleswe.fullname" . }}
  namespace: {{ include "simpleswe.namespace" . }}
  labels:
    {{- include "simpleswe.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "simpleswe.serviceAccountName" . }}
    namespace: {{ include "simpleswe.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "simpleswe.fullname" . }}
